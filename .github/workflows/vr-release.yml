# BOTW VR's release builds (no game code inside: the player's machine builds it from their own files):
#   windows: build/dist/BOTW-VR-Recomp-<version>-Windows.zip (when the windows input is on)
#   linux:   build/dist/BOTW-VR-Recomp-<version>-x86_64.AppImage
#   Steam Frame: build/dist/BOTW-VR-Recomp-<version>-SteamFrame-aarch64.AppImage
# (no "Linux" in the AppImages' names, and the project's name in all of them: the AppImage catalog checks both)
# attached to the release named by the tag input (made as a pre-release if it does not exist yet).
name: VR release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the builds to (e.g. vr-2026.11.21)
        required: true
      arch:
        description: Linux architecture
        type: choice
        options:
          - x86_64
          - aarch64
        default: x86_64
        required: true
      windows:
        description: Also build the Windows zip (make dist VR=1)
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - name: The tag is the source's BOTW VR release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          # (runtime/vr/botwvr_version.h: BOTWVR_RELEASE is set in the commit the tag is made on)
          REL=$(sed -n 's/^#define BOTWVR_RELEASE "\(.*\)"/\1/p' runtime/vr/botwvr_version.h)
          [ "$RELEASE_TAG" = "vr-$REL" ] || { echo "tag $RELEASE_TAG, but runtime/vr/botwvr_version.h says vr-$REL" >&2; exit 1; }
      - name: Podman
        run: podman --version || (sudo apt-get update -q && sudo apt-get install -y -q podman)
      - name: QEMU for aarch64
        if: inputs.arch == 'aarch64'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-user-binfmt binfmt-support
      - name: AppImage (VR=1)
        env:
          BUILD_ARCH: ${{ inputs.arch }}
        run: make appimage VR=1 ARCH="$BUILD_ARCH"
      - name: The Linux target's name
        env:
          BUILD_ARCH: ${{ inputs.arch }}
        run: |
          # (tools/linux/package.sh names it)
          VERSION=$(sed -n 's/^#define BOTWVR_PHASE "\(.*\)"/\1/p' runtime/vr/botwvr_version.h)-$(sed -n 's/^#define BOTWVR_RELEASE "\(.*\)"/\1/p' runtime/vr/botwvr_version.h)
          case "$BUILD_ARCH" in
            x86_64) NEW="build/dist/BOTW-VR-Recomp-$VERSION-x86_64.AppImage" ;;
            aarch64) NEW="build/dist/BOTW-VR-Recomp-$VERSION-SteamFrame-aarch64.AppImage" ;;
            *) echo "unsupported architecture: $BUILD_ARCH" >&2; exit 1 ;;
          esac
          test -f "$NEW"
      - name: Smoke test (x86_64, from its FUSE mount)
        if: inputs.arch == 'x86_64'
        run: |
          # (the AppImage as players run it, mounted: a launcher that broke the mount once passed every build step)
          sudo apt-get install -y -q fuse3 libfuse2 >/dev/null 2>&1 || true
          F=$(ls build/dist/BOTW-VR-Recomp-*-x86_64.AppImage)
          chmod +x "$F"
          export SAVAGEWIND_DATA_ROOT="$RUNNER_TEMP/sw-data" SAVAGEWIND_HIDDEN=1 SAVAGEWIND_VR=0
          timeout 120 "$F" --version
          timeout 120 "$F" paths   # (a command that needs no game files: 0 when the runtime ran)
          grep -q 'Runtime exit status: 0' "$SAVAGEWIND_DATA_ROOT/savagewind-launcher.log"
      - uses: actions/upload-artifact@v4
        with:
          name: botw-vr-linux-${{ inputs.arch }}
          path: build/dist/*-${{ inputs.arch }}.AppImage
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          BUILD_ARCH: ${{ inputs.arch }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --prerelease --title "BOTW VR alpha ($RELEASE_TAG)" \
              --notes "BOTW VR builds: Windows, Linux x86_64, and experimental Linux ARM64 for Steam Frame." || \
            { sleep 20; gh release view "$RELEASE_TAG" >/dev/null; }
          VERSION=$(sed -n 's/^#define BOTWVR_PHASE "\(.*\)"/\1/p' runtime/vr/botwvr_version.h)-$(sed -n 's/^#define BOTWVR_RELEASE "\(.*\)"/\1/p' runtime/vr/botwvr_version.h)
          case "$BUILD_ARCH" in
            x86_64) NEW_FILE="build/dist/BOTW-VR-Recomp-$VERSION-x86_64.AppImage" ;;
            aarch64) NEW_FILE="build/dist/BOTW-VR-Recomp-$VERSION-SteamFrame-aarch64.AppImage" ;;
            *) echo "unsupported architecture: $BUILD_ARCH" >&2; exit 1 ;;
          esac
          test -f "$NEW_FILE.zsync"   # (AppImageUpdate's delta file: tools/linux/package.sh)
          gh release upload "$RELEASE_TAG" "$NEW_FILE" "$NEW_FILE.zsync" --clobber

  windows:
    if: inputs.windows
    runs-on: windows-latest
    timeout-minutes: 150
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make zip unzip mingw-w64-ucrt-x86_64-clang mingw-w64-ucrt-x86_64-lld mingw-w64-ucrt-x86_64-sdl3
            mingw-w64-ucrt-x86_64-ffmpeg mingw-w64-ucrt-x86_64-vulkan-headers mingw-w64-ucrt-x86_64-vulkan-loader
            mingw-w64-ucrt-x86_64-shaderc mingw-w64-ucrt-x86_64-spirv-tools mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-vulkan-memory-allocator mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-openxr-sdk
      - name: LGPL FFmpeg (make deps-windows)
        run: make deps-windows
      - name: The game code generator helper (make gen-helper)
        env:
          PY_DIR: ${{ env.pythonLocation }}
        run: make gen-helper GEN_PY="$(cygpath -u "$PY_DIR")/python.exe"
      - name: The compiler players build the game code with
        run: tools/fetch_zig.sh
      - name: Windows zip (make dist VR=1)
        run: |
          # (the PGO profile is for the clang that wrote it: a newer MSYS2 clang may refuse it, then the plain build)
          make -j$(nproc) dist VR=1 || { rm -rf build/win-release; make -j$(nproc) dist VR=1 DIST_PGO=; }
          ls -l build/dist/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: botw-vr-windows
          path: build/dist/*.zip
      - name: Attach to the release
        shell: bash   # (gh is on the runner's own PATH, not MSYS2's)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          # (the Linux job may be creating it at the same moment: a failed create is fine if it exists by then)
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --prerelease --title "BOTW VR alpha ($RELEASE_TAG)" \
              --notes "BOTW VR builds: Windows, Linux x86_64, and experimental Linux ARM64 for Steam Frame." || \
            { sleep 20; gh release view "$RELEASE_TAG" >/dev/null; }
          gh release upload "$RELEASE_TAG" build/dist/*.zip --clobber
